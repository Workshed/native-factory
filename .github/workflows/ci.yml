name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux is deliberate: CI runs only the checks that need no Tart, no Xcode and no
    # Apple Silicon. VM acceptance tests (pytest -m vm) run on a developer host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Schemas in sync
        run: uv run python -m native_factory.config.export_schemas --check

      - name: Tests
        run: uv run pytest tests/unit tests/contract

      - name: No provider-specific logic outside providers/
        run: ./scripts/check-provider-isolation.sh
