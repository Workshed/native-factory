[project]
name = "native-factory-cli"
version = "0.1.0"
description = "Native Factory host CLI"
requires-python = ">=3.12"
dependencies = [
    "native-factory-core",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
native-factory = "native_factory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/native_factory"]

[tool.uv.sources]
native-factory-core = { workspace = true }
