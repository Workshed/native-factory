[project]
name = "native-factory-core"
version = "0.1.0"
description = "Shared schemas and artefact IO for Native Factory"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/native_factory_core"]
