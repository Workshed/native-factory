[project]
name = "native-factory-guest"
version = "0.1.0"
description = "Native Factory in-guest runtime"
requires-python = ">=3.12"
dependencies = [
    "native-factory-core",
    "typer>=0.15",
    "rich>=13.9",
]

# The OpenHands stack is deliberately an optional extra: Milestone 1 does not need it,
# and keeping it out of the default install keeps `uv sync` fast for contributors who
# are only working on the host CLI. The golden image installs `[agent]` (Milestone 2).
[project.optional-dependencies]
agent = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server",
]

[project.scripts]
native-factory-guest = "native_factory_guest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/native_factory_guest"]

[tool.uv.sources]
native-factory-core = { workspace = true }
