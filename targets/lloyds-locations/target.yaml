name: Where We Are
url: https://www.lloydsbankinggroup.com/careers/where-we-are.html
max_routes: 14
# Headless Chromium is served an "Error 1007" block page by this site; WebKit is not.
# See docs/discovery.md.
engine: webkit
# One level deep from the listing, and no further: without this the crawl reaches
# job search, the cookie notice and a Workday job template.
include_path: /careers/where-we-are
# Navigation here is links, so the deterministic crawl reaches everything and there is
# no interactive flow for `explore` to walk.
plan: inspect gate build-ios build-android capture test
