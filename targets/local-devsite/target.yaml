name: Widget Shop
# A dev server on this machine's loopback. scripts/site-bridge.sh makes it reachable from
# the guest at the same URL, so nothing here is rewritten.
url: http://localhost:3000/
max_routes: 4
plan: inspect gate build-ios capture test

# The site's own source, read for APIs and business rules — never translated.
# source_path: /path/to/a/checkout   # optional: read for APIs and business rules

# Explicit, so the build does not infer one from git config or the app name.
bundle_id: dev.nativefactory.widgetshop
application_id: dev.nativefactory.widgetshop
